name: postgres-to-mongodb-sync

services:
  mongodb-atlas-local:
    image: mongodb/mongodb-atlas-local:8.3.8
    container_name: mongodb-atlas-local
    ports:
      - "27017:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: root
      MONGODB_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username root --password root --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17.11
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
    command:
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=app"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-1}
      KAFKA_LOG_CLEANUP_POLICY: compact
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  debezium:
    build:
      context: .
      dockerfile: Dockerfile.debezium
    image: local/debezium-mongodb-connect:1.0.0
    container_name: debezium
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8083/connectors > /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  customer-document-aggregator:
    build:
      context: ./customer-document-aggregator
    image: local/customer-document-aggregator:1.0.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      aggregation-topic-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_APPLICATION_ID: customer-document-aggregator
      KAFKA_STREAM_THREADS: ${KAFKA_STREAM_THREADS:-1}

  aggregation-topic-init:
    image: apache/kafka:4.3.1
    container_name: aggregation-topic-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      AGGREGATION_TOPIC_PARTITIONS: ${AGGREGATION_TOPIC_PARTITIONS:-12}
    volumes:
      - ./connectors:/connectors:ro
    entrypoint: ["/bin/sh", "/connectors/create-topics.sh"]

  connector-init:
    image: curlimages/curl:8.21.0
    container_name: connector-init
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium:
        condition: service_healthy
      mongodb-atlas-local:
        condition: service_healthy
      customer-document-aggregator:
        condition: service_started
    volumes:
      - ./connectors:/connectors:ro
    entrypoint: ["/bin/sh", "/connectors/register.sh"]

volumes:
  mongodb_data:
  postgres_data:
  kafka_data:
